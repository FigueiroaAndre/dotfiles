# ==========================================
# CORE SANE DEFAULTS & QUALITY OF LIFE
# ==========================================

# Switch prefix key from Ctrl+b to Ctrl+a (much easier to reach)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support (clicking, resizing, scrolling)
set -g mouse on

# Fix escape key lag in Vim/Neovim
set -sg escape-time 0

# Increase scrollback history limit
set -g history-limit 10000

# Use Vi keybindings in copy mode
setw -g mode-keys vi

# Bind 'v' to begin selection (like Vim Visual Mode)
bind -T copy-mode-vi v send -X begin-selection

# Bind 'V' to toggle rectangle selection (like Vim Visual Block Mode)
bind -T copy-mode-vi V send -X rectangle-toggle

# Bind 'y' to yank/copy text to the tmux buffer
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==========================================
# CUSTOM NAVIGATION & SPLIT KEYBINDINGS
# ==========================================

# Split panes using | and - (instead of % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes using Vim motions (Prefix + h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easy config reload (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# ==========================================
# DESIGN & COLOR CUSTOMIZATION
# ==========================================

# Enable true color support (256color / Tc)
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Minimal status bar styling
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=white]| "
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M"

# Highlight active window tab
setw -g window-status-current-style fg=black,bg=green,bold
